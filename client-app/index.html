<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAV-tech — Appli client</title>
<style>
  :root {
    --color-bg: #f5f6f8;
    --color-surface: #ffffff;
    --color-text: #1c1e21;
    --color-text-muted: #5f6368;
    --color-border: #e1e3e6;
    --color-primary: #2563eb;
    --color-primary-hover: #1d4ed8;
    --color-error-bg: #fdecec;
    --color-error-border: #f3b4b4;
    --color-error-text: #8a1f1f;
    --radius: 10px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.5;
  }

  header {
    padding: 1.25rem 1rem;
    text-align: center;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
  }

  header h1 {
    margin: 0;
    font-size: 1.25rem;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-top: 1rem;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--color-text-muted);
    font-size: 0.95rem;
  }

  .spinner {
    width: 1rem;
    height: 1rem;
    border: 2px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  label {
    font-size: 0.85rem;
    color: var(--color-text-muted);
  }

  input[type="password"] {
    font-size: 1rem;
    padding: 0.65rem 0.75rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    width: 100%;
  }

  input[type="password"]:focus {
    outline: 2px solid var(--color-primary);
    outline-offset: 1px;
  }

  button {
    font-size: 1rem;
    font-weight: 600;
    padding: 0.7rem 1rem;
    border: none;
    border-radius: var(--radius);
    background: var(--color-primary);
    color: #fff;
    cursor: pointer;
  }

  button:hover {
    background: var(--color-primary-hover);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .content-label {
    margin: 0 0 0.5rem;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-text-muted);
  }

  .content-value {
    margin: 0;
    font-size: 0.9rem;
    word-break: break-word;
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  .error {
    background: var(--color-error-bg);
    border: 1px solid var(--color-error-border);
    color: var(--color-error-text);
    border-radius: var(--radius);
    padding: 1rem;
    margin-top: 1rem;
  }

  .error strong {
    display: block;
    margin-bottom: 0.35rem;
  }

  .hidden {
    display: none;
  }

  footer {
    text-align: center;
    color: var(--color-text-muted);
    font-size: 0.75rem;
    padding: 1.5rem 1rem;
  }
</style>
</head>
<body>
  <header>
    <h1>SAV-tech — Suivi de réparation</h1>
  </header>

  <main>
    <div class="card">
      <form id="password-form">
        <div>
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="submit-btn">Valider</button>
      </form>
    </div>

    <div id="status" class="status hidden">
      <span class="spinner"></span>
      <span>Vérification…</span>
    </div>

    <div id="result" class="card hidden">
      <p class="content-label">Données déchiffrées</p>
      <p id="content-value" class="content-value"></p>
    </div>

    <div id="error" class="error hidden">
      <strong>Erreur</strong>
      <span id="error-message"></span>
    </div>
  </main>

  <footer>Étape B — déchiffrement AES-GCM + PBKDF2</footer>

  <script>
    const FILE_URL = "https://raw.githubusercontent.com/Matrice971/SAV-tech/main/data/clients/test.txt";
    const PBKDF2_ITERATIONS = 100000;

    const formEl = document.getElementById("password-form");
    const passwordEl = document.getElementById("password");
    const submitBtnEl = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const contentValueEl = document.getElementById("content-value");
    const errorEl = document.getElementById("error");
    const errorMessageEl = document.getElementById("error-message");

    function resetViews() {
      resultEl.classList.add("hidden");
      errorEl.classList.add("hidden");
    }

    function showStatus(message) {
      statusEl.querySelector("span:last-child").textContent = message;
      statusEl.classList.remove("hidden");
    }

    function hideStatus() {
      statusEl.classList.add("hidden");
    }

    function showResult(jsonText) {
      contentValueEl.textContent = jsonText;
      resultEl.classList.remove("hidden");
    }

    function showError(message) {
      errorMessageEl.textContent = message;
      errorEl.classList.remove("hidden");
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function deriveKey(password, saltBytes) {
      const passwordBytes = new TextEncoder().encode(password);
      const baseKey = await crypto.subtle.importKey(
        "raw",
        passwordBytes,
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBytes,
          iterations: PBKDF2_ITERATIONS,
          hash: "SHA-256",
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decryptFile(fileContent, password) {
      const parts = fileContent.trim().split(".");
      if (parts.length !== 3) {
        throw new Error("format de fichier invalide");
      }
      const [saltB64, ivB64, ciphertextB64] = parts;
      const salt = base64ToBytes(saltB64);
      const iv = base64ToBytes(ivB64);
      const ciphertext = base64ToBytes(ciphertextB64);

      const key = await deriveKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
      return new TextDecoder().decode(decrypted);
    }

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      resetViews();
      submitBtnEl.disabled = true;
      showStatus("Récupération du fichier…");

      try {
        let response;
        try {
          response = await fetch(FILE_URL, { cache: "no-store" });
        } catch {
          throw { userMessage: "Connexion impossible. Vérifiez votre accès à internet et réessayez." };
        }

        if (response.status === 404) {
          throw { userMessage: "Le fichier client est introuvable." };
        }
        if (!response.ok) {
          throw { userMessage: `Le serveur a répondu avec une erreur (code ${response.status}).` };
        }

        const fileContent = await response.text();

        showStatus("Déchiffrement…");
        let decryptedText;
        try {
          decryptedText = await decryptFile(fileContent, passwordEl.value);
        } catch {
          throw { userMessage: "Mot de passe incorrect ou fichier corrompu." };
        }

        let displayText = decryptedText;
        try {
          displayText = JSON.stringify(JSON.parse(decryptedText), null, 2);
        } catch {
          // Le contenu déchiffré n'est pas du JSON valide : on l'affiche tel quel.
        }

        hideStatus();
        showResult(displayText);
      } catch (err) {
        hideStatus();
        showError(err && err.userMessage ? err.userMessage : "Une erreur inattendue est survenue.");
      } finally {
        submitBtnEl.disabled = false;
      }
    });
  </script>
</body>
</html>
