<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAV-tech — Appli client</title>
<style>
  :root {
    --color-bg: #f5f6f8;
    --color-surface: #ffffff;
    --color-text: #1c1e21;
    --color-text-muted: #5f6368;
    --color-border: #e1e3e6;
    --color-primary: #2563eb;
    --color-primary-hover: #1d4ed8;
    --color-error-bg: #fdecec;
    --color-error-border: #f3b4b4;
    --color-error-text: #8a1f1f;
    --radius: 10px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.5;
  }

  header {
    padding: 1.25rem 1rem;
    text-align: center;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
  }

  header h1 {
    margin: 0;
    font-size: 1.25rem;
  }

  .app-version {
    display: block;
    margin-top: 0.2rem;
    font-size: 0.75rem;
    font-weight: 400;
    color: var(--color-text-muted);
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-top: 1rem;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--color-text-muted);
    font-size: 0.95rem;
  }

  .spinner {
    width: 1rem;
    height: 1rem;
    border: 2px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  label {
    font-size: 0.85rem;
    color: var(--color-text-muted);
  }

  input[type="password"] {
    font-size: 1rem;
    padding: 0.65rem 0.75rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    width: 100%;
  }

  input[type="password"]:focus {
    outline: 2px solid var(--color-primary);
    outline-offset: 1px;
  }

  button {
    font-size: 1rem;
    font-weight: 600;
    padding: 0.7rem 1rem;
    border: none;
    border-radius: var(--radius);
    background: var(--color-primary);
    color: #fff;
    cursor: pointer;
  }

  button:hover {
    background: var(--color-primary-hover);
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .button-secondary {
    background: transparent;
    color: var(--color-primary);
    border: 1px solid var(--color-border);
    font-weight: 600;
  }

  .button-secondary:hover {
    background: var(--color-surface);
    border-color: var(--color-primary);
  }

  .error {
    background: var(--color-error-bg);
    border: 1px solid var(--color-error-border);
    color: var(--color-error-text);
    border-radius: var(--radius);
    padding: 1rem;
    margin-top: 1rem;
  }

  .error strong {
    display: block;
    margin-bottom: 0.35rem;
  }

  .hidden {
    display: none;
  }

  .screen-title {
    margin: 1.25rem 0 0.5rem;
    font-size: 1.15rem;
  }

  .device-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .device-item {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1rem;
    margin-top: 0.75rem;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }

  .device-item:hover,
  .device-item:focus {
    border-color: var(--color-primary);
    outline: none;
  }

  .device-item-title {
    font-weight: 600;
  }

  .device-item-center {
    color: var(--color-text-muted);
    font-size: 0.85rem;
    margin-top: 0.25rem;
  }

  .empty-message {
    color: var(--color-text-muted);
    text-align: center;
    padding: 2rem 1rem;
  }

  .detail-label {
    margin: 0.9rem 0 0.15rem;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-text-muted);
  }

  .detail-label:first-child {
    margin-top: 0;
  }

  .detail-value {
    margin: 0;
    font-size: 0.95rem;
    word-break: break-word;
  }

  .detail-note {
    margin: 0.9rem 0 0;
    padding: 0.6rem 0.75rem;
    background: var(--color-bg);
    border-radius: var(--radius);
    font-size: 0.9rem;
  }

  .back-link {
    margin-top: 1rem;
  }

  .list-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.75rem;
  }

  .button-small {
    padding: 0.4rem 0.75rem;
    font-size: 0.85rem;
  }

  .close-message {
    margin: 0;
    font-size: 0.8rem;
    color: var(--color-text-muted);
  }

  .drive-header {
    margin-top: 0.75rem;
  }

  .link-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0.6rem 0.9rem;
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    background: var(--color-surface);
    color: var(--color-primary);
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
  }

  .link-button:hover {
    border-color: var(--color-primary);
    background: var(--color-bg);
  }

  .detail-links {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid var(--color-border);
  }

  footer {
    text-align: center;
    color: var(--color-text-muted);
    font-size: 0.75rem;
    padding: 1.5rem 1rem;
  }
</style>
</head>
<body>
  <header>
    <h1>SAV-tech — Suivi de réparation</h1>
    <span class="app-version">V1.01</span>
  </header>

  <main>
    <div id="screen-password">
      <div class="card">
        <form id="password-form">
          <div>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" id="submit-btn">Valider</button>
        </form>
      </div>

      <div id="status" class="status hidden">
        <span class="spinner"></span>
        <span>Vérification…</span>
      </div>

      <div id="error" class="error hidden">
        <strong>Erreur</strong>
        <span id="error-message"></span>
      </div>
    </div>

    <div id="screen-list" class="hidden">
      <div class="list-actions">
        <button type="button" id="logout-btn" class="button-secondary button-small">Déconnexion</button>
        <button type="button" id="close-btn" class="button-secondary button-small">Fermer</button>
        <p id="close-message" class="close-message hidden">Vous pouvez fermer cet onglet ou cette fenêtre manuellement.</p>
      </div>
      <div id="drive-header" class="drive-header hidden">
        <a id="drive-link" href="#" target="_blank" rel="noopener noreferrer" class="link-button">Accéder à mon Drive</a>
      </div>
      <h2 id="list-title" class="screen-title"></h2>
      <ul id="device-list" class="device-list"></ul>
      <p id="empty-message" class="empty-message hidden">Aucun matériel actuellement en réparation.</p>
    </div>

    <div id="screen-detail" class="hidden">
      <button type="button" id="back-btn" class="button-secondary back-link">← Retour à la liste</button>
      <div class="card">
        <h2 id="detail-title" class="screen-title"></h2>
        <div id="detail-body"></div>
      </div>
    </div>
  </main>

  <footer>Étape C — liste et détail des appareils</footer>

  <script>
    const FILE_URL = "https://raw.githubusercontent.com/Matrice971/SAV-tech/main/data/clients/test.txt";
    const PBKDF2_ITERATIONS = 100000;
    const REMISE_SERVICE_VISIBILITY_DAYS = 90;

    const ETAT_LABELS = {
      1: "Réparation finalisée",
      2: "En attente de pièce",
      3: "Livrée et testée",
    };

    const LIEU_LABELS = {
      atelier: "Atelier",
      site: "Site",
    };

    const screenPasswordEl = document.getElementById("screen-password");
    const screenListEl = document.getElementById("screen-list");
    const screenDetailEl = document.getElementById("screen-detail");

    const formEl = document.getElementById("password-form");
    const passwordEl = document.getElementById("password");
    const submitBtnEl = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const errorMessageEl = document.getElementById("error-message");

    const listTitleEl = document.getElementById("list-title");
    const deviceListEl = document.getElementById("device-list");
    const emptyMessageEl = document.getElementById("empty-message");
    const logoutBtnEl = document.getElementById("logout-btn");
    const closeBtnEl = document.getElementById("close-btn");
    const closeMessageEl = document.getElementById("close-message");
    const driveHeaderEl = document.getElementById("drive-header");
    const driveLinkEl = document.getElementById("drive-link");

    const detailTitleEl = document.getElementById("detail-title");
    const detailBodyEl = document.getElementById("detail-body");
    const backBtnEl = document.getElementById("back-btn");

    let visibleAppareils = [];
    let emailContact = null;

    function showScreen(screen) {
      screenPasswordEl.classList.toggle("hidden", screen !== "password");
      screenListEl.classList.toggle("hidden", screen !== "list");
      screenDetailEl.classList.toggle("hidden", screen !== "detail");
    }

    function showStatus(message) {
      statusEl.querySelector("span:last-child").textContent = message;
      statusEl.classList.remove("hidden");
    }

    function hideStatus() {
      statusEl.classList.add("hidden");
    }

    function showError(message) {
      errorEl.classList.remove("hidden");
      errorMessageEl.textContent = message;
    }

    function hideError() {
      errorEl.classList.add("hidden");
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    async function deriveKey(password, saltBytes) {
      const passwordBytes = new TextEncoder().encode(password);
      const baseKey = await crypto.subtle.importKey(
        "raw",
        passwordBytes,
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: saltBytes,
          iterations: PBKDF2_ITERATIONS,
          hash: "SHA-256",
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decryptFile(fileContent, password) {
      const parts = fileContent.trim().split(".");
      if (parts.length !== 3) {
        throw new Error("format de fichier invalide");
      }
      const [saltB64, ivB64, ciphertextB64] = parts;
      const salt = base64ToBytes(saltB64);
      const iv = base64ToBytes(ivB64);
      const ciphertext = base64ToBytes(ciphertextB64);

      const key = await deriveKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
      return new TextDecoder().decode(decrypted);
    }

    // Parse une date "AAAA-MM-JJ" en objet Date local (évite le décalage de
    // fuseau horaire qu'introduirait new Date("AAAA-MM-JJ"), interprété en UTC).
    function parseIsoDate(isoDate) {
      const [year, month, day] = isoDate.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function formatDateFr(isoDate) {
      return new Intl.DateTimeFormat("fr-FR", {
        day: "numeric",
        month: "long",
        year: "numeric",
      }).format(parseIsoDate(isoDate));
    }

    function daysSince(isoDate) {
      const today = new Date();
      const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const target = parseIsoDate(isoDate);
      const msPerDay = 24 * 60 * 60 * 1000;
      return Math.round((todayMidnight - target) / msPerDay);
    }

    function isAppareilVisible(appareil) {
      if (!appareil.date_remise_service) {
        return true;
      }
      return daysSince(appareil.date_remise_service) < REMISE_SERVICE_VISIBILITY_DAYS;
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    function renderList(data) {
      emailContact = data.email_contact || null;

      const driveLink = (data.appareils || []).find((a) => a.lien_drive)?.lien_drive;
      if (driveLink) {
        driveLinkEl.href = driveLink;
        driveHeaderEl.classList.remove("hidden");
      } else {
        driveHeaderEl.classList.add("hidden");
      }

      listTitleEl.textContent = `Bonjour ${data.contact}`;
      visibleAppareils = (data.appareils || []).filter(isAppareilVisible);

      deviceListEl.innerHTML = "";
      const isEmpty = visibleAppareils.length === 0;
      emptyMessageEl.classList.toggle("hidden", !isEmpty);
      deviceListEl.classList.toggle("hidden", isEmpty);

      visibleAppareils.forEach((appareil, index) => {
        const li = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.className = "device-item";
        button.innerHTML = `
          <div class="device-item-title">${escapeHtml(appareil.type)} — ${escapeHtml(appareil.num_serie)}</div>
          <div class="device-item-center">${escapeHtml(appareil.centre_origine)}</div>
        `;
        button.addEventListener("click", () => {
          renderDetail(appareil);
          showScreen("detail");
        });
        li.appendChild(button);
        deviceListEl.appendChild(li);
      });
    }

    function renderDetail(appareil) {
      detailTitleEl.textContent = `${appareil.type} — ${appareil.num_serie}`;

      const etatLabel = ETAT_LABELS[appareil.etat] || "Statut inconnu";
      const lieuLabel = LIEU_LABELS[appareil.lieu_prise_charge] || appareil.lieu_prise_charge;

      let html = `
        <p class="detail-label">Centre d'origine</p>
        <p class="detail-value">${escapeHtml(appareil.centre_origine)}</p>

        <p class="detail-label">Adresse</p>
        <p class="detail-value">${escapeHtml(appareil.adresse)}</p>

        <p class="detail-label">Statut actuel</p>
        <p class="detail-value">${escapeHtml(etatLabel)}</p>

        <p class="detail-label">Prise en charge</p>
        <p class="detail-value">${escapeHtml(formatDateFr(appareil.date_prise_charge))} — ${escapeHtml(lieuLabel)}</p>
      `;

      if (appareil.piece_en_commande) {
        html += `<p class="detail-note">Pièce en commande</p>`;
      }

      if (appareil.materiel_prete_num_serie) {
        html += `<p class="detail-note">Matériel de prêt : ${escapeHtml(appareil.materiel_prete_num_serie)}</p>`;
      }

      if (appareil.commentaire_technicien) {
        html += `
          <p class="detail-label">Commentaire technicien</p>
          <p class="detail-value">${escapeHtml(appareil.commentaire_technicien)}</p>
        `;
      }

      if (appareil.date_remise_service) {
        html += `
          <p class="detail-label">Remise en service</p>
          <p class="detail-value">Remis en service le ${escapeHtml(formatDateFr(appareil.date_remise_service))}</p>
        `;
      }

      const links = [];

      if (appareil.lien_drive) {
        links.push(
          `<a href="${escapeHtml(appareil.lien_drive)}" target="_blank" rel="noopener noreferrer" class="link-button">Accéder à mon Drive</a>`
        );
      }

      if (emailContact) {
        const subject = `Question - ${appareil.centre_origine} - ${appareil.type} - ${appareil.num_serie}`;
        const body =
          `Bonjour, j'ai une question concernant la réparation de mon matériel ${appareil.type} ` +
          `(n° série ${appareil.num_serie}) situé à ${appareil.centre_origine} :`;
        const mailtoUrl = `mailto:${emailContact}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        links.push(`<a href="${escapeHtml(mailtoUrl)}" class="link-button">Un commentaire ou une question sur cette réparation ?</a>`);
      }

      if (links.length > 0) {
        html += `<div class="detail-links">${links.join("")}</div>`;
      }

      detailBodyEl.innerHTML = html;
    }

    backBtnEl.addEventListener("click", () => {
      showScreen("list");
    });

    function resetToPasswordScreen() {
      visibleAppareils = [];
      emailContact = null;
      listTitleEl.textContent = "";
      deviceListEl.innerHTML = "";
      detailBodyEl.innerHTML = "";
      driveHeaderEl.classList.add("hidden");
      passwordEl.value = "";
      hideError();
      hideStatus();
      closeBtnEl.classList.remove("hidden");
      closeMessageEl.classList.add("hidden");
      showScreen("password");
    }

    logoutBtnEl.addEventListener("click", resetToPasswordScreen);

    closeBtnEl.addEventListener("click", () => {
      window.close();
      setTimeout(() => {
        closeBtnEl.classList.add("hidden");
        closeMessageEl.classList.remove("hidden");
      }, 300);
    });

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      hideError();
      submitBtnEl.disabled = true;
      showStatus("Récupération du fichier…");

      try {
        let response;
        try {
          response = await fetch(FILE_URL, { cache: "no-store" });
        } catch {
          throw { userMessage: "Connexion impossible. Vérifiez votre accès à internet et réessayez." };
        }

        if (response.status === 404) {
          throw { userMessage: "Le fichier client est introuvable." };
        }
        if (!response.ok) {
          throw { userMessage: `Le serveur a répondu avec une erreur (code ${response.status}).` };
        }

        const fileContent = await response.text();

        showStatus("Déchiffrement…");
        let decryptedText;
        try {
          decryptedText = await decryptFile(fileContent, passwordEl.value);
        } catch {
          throw { userMessage: "Mot de passe incorrect ou fichier corrompu." };
        }

        let data;
        try {
          data = JSON.parse(decryptedText);
        } catch {
          throw { userMessage: "Les données déchiffrées sont invalides." };
        }

        hideStatus();
        renderList(data);
        showScreen("list");
      } catch (err) {
        hideStatus();
        showError(err && err.userMessage ? err.userMessage : "Une erreur inattendue est survenue.");
      } finally {
        submitBtnEl.disabled = false;
      }
    });
  </script>
</body>
</html>
