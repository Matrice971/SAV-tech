<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAV-tech — Appli client</title>
<style>
  :root {
    --color-bg: #f5f6f8;
    --color-surface: #ffffff;
    --color-text: #1c1e21;
    --color-text-muted: #5f6368;
    --color-border: #e1e3e6;
    --color-primary: #2563eb;
    --color-error-bg: #fdecec;
    --color-error-border: #f3b4b4;
    --color-error-text: #8a1f1f;
    --radius: 10px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.5;
  }

  header {
    padding: 1.25rem 1rem;
    text-align: center;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
  }

  header h1 {
    margin: 0;
    font-size: 1.25rem;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
  }

  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: 1rem;
    margin-top: 1rem;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--color-text-muted);
    font-size: 0.95rem;
  }

  .spinner {
    width: 1rem;
    height: 1rem;
    border: 2px solid var(--color-border);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .content-label {
    margin: 0 0 0.5rem;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--color-text-muted);
  }

  .content-value {
    margin: 0;
    font-size: 1.1rem;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .error {
    background: var(--color-error-bg);
    border: 1px solid var(--color-error-border);
    color: var(--color-error-text);
    border-radius: var(--radius);
    padding: 1rem;
    margin-top: 1rem;
  }

  .error strong {
    display: block;
    margin-bottom: 0.35rem;
  }

  .hidden {
    display: none;
  }

  footer {
    text-align: center;
    color: var(--color-text-muted);
    font-size: 0.75rem;
    padding: 1.5rem 1rem;
  }
</style>
</head>
<body>
  <header>
    <h1>SAV-tech — Suivi de réparation</h1>
  </header>

  <main>
    <div id="status" class="status">
      <span class="spinner"></span>
      <span>Récupération des données…</span>
    </div>

    <div id="result" class="card hidden">
      <p class="content-label">Contenu de test.txt</p>
      <p id="content-value" class="content-value"></p>
    </div>

    <div id="error" class="error hidden">
      <strong>Impossible de récupérer les données</strong>
      <span id="error-message"></span>
    </div>
  </main>

  <footer>Étape A — lecture brute, sans chiffrement (version de test)</footer>

  <script>
    const FILE_URL = "https://raw.githubusercontent.com/Matrice971/SAV-tech/main/data/clients/test.txt";

    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const contentValueEl = document.getElementById("content-value");
    const errorEl = document.getElementById("error");
    const errorMessageEl = document.getElementById("error-message");

    function showResult(text) {
      statusEl.classList.add("hidden");
      contentValueEl.textContent = text;
      resultEl.classList.remove("hidden");
    }

    function showError(message) {
      statusEl.classList.add("hidden");
      errorMessageEl.textContent = message;
      errorEl.classList.remove("hidden");
    }

    async function loadTestFile() {
      let response;
      try {
        response = await fetch(FILE_URL, { cache: "no-store" });
      } catch {
        showError("Connexion impossible. Vérifiez votre accès à internet et réessayez.");
        return;
      }

      if (response.status === 404) {
        showError("Le fichier test.txt est introuvable dans le dépôt.");
        return;
      }

      if (!response.ok) {
        showError(`Le serveur a répondu avec une erreur (code ${response.status}).`);
        return;
      }

      const text = await response.text();
      showResult(text);
    }

    loadTestFile();
  </script>
</body>
</html>
